<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karaokê — Player e Admin</title>
    <script>
      // aplica o tema salvo (ou o do sistema) antes de pintar, evitando piscada
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("tema");
        } catch (e) {}
        if (!tema) {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", tema);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap"
    />
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div class="app">
      <header class="glass">
        <div class="marca">
          <div class="logo">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
            </svg>
          </div>
          <h1>Karaokê</h1>
        </div>

        <label class="busca">
          <span
            class="sr-only"
            style="
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip: rect(0 0 0 0);
            "
            >Buscar músicas</span
          >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input
            type="text"
            id="busca"
            placeholder="Buscar músicas ou artistas"
          />
        </label>

        <div class="topo-acoes">
          <button
            type="button"
            id="btnTema"
            aria-label="Ativar modo escuro"
            aria-pressed="false"
          >
            <svg
              class="icone-lua"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg
              class="icone-sol"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          </button>
          <div class="avatar" aria-hidden="true">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#fff"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
          </div>
        </div>
      </header>

      <main>
        <!-- COLUNA 1: PLAYLIST -->
        <aside id="playlist" class="glass">
          <h2>Músicas</h2>
          <ul id="listaMusicas"></ul>
        </aside>

        <!-- COLUNA 2: PALCO DO PLAYER -->
        <section id="palco">
          <div class="palco-topo">
            <div class="capa" aria-hidden="true">
              <svg
                width="56"
                height="56"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="9" y="3" width="6" height="11" rx="3" />
                <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
              </svg>
            </div>
            <div class="palco-info">
              <h2 id="nomeMusica">Escolha uma música</h2>
              <p id="artista"></p>
              <p id="tag"></p>
            </div>
          </div>

          <div class="painel-letra">
            <p id="letra"></p>
            <p id="contador"></p>
          </div>

          <button id="btnTocar" disabled>▶ Tocar</button>
        </section>

        <!-- COLUNA 3: PAINEL DE ADMINISTRAÇÃO (CRUD) -->
        <aside id="admin" class="glass">
          <h2>Administração</h2>

          <form id="formMusica">
            <input type="hidden" id="inputId" />

            <label for="inputNome">Nome da música</label>
            <input type="text" id="inputNome" placeholder="Ex: My Hero" />

            <label for="inputArtista">Artista</label>
            <input
              type="text"
              id="inputArtista"
              placeholder="Ex: Foo Fighters"
            />
            <label for="inputCapa">URL da capa <small>(opcional)</small></label>
            <input
              type="text"
              id="inputCapa"
              placeholder="https://exemplo.com/capa.jpg"
            />
            <div class="acoes">
              <button type="submit" id="btnSalvar">Salvar</button>
              <button type="button" id="btnNovo">Nova música</button>
            </div>
          </form>

          <button type="button" id="btnExcluir" disabled>
            Excluir selecionada
          </button>

          <div id="mensagem"></div>
        </aside>
      </main>

      <!-- BARRA INFERIOR (espelha a música atual) -->
      <footer id="barra" class="glass">
        <div class="barra-capa" aria-hidden="true"></div>
        <div class="barra-info">
          <div id="barraNome">Escolha uma música</div>
          <div id="barraArtista"></div>
        </div>
        <button type="button" id="barraTocar" aria-label="Tocar" disabled>
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="#fff"
            aria-hidden="true"
          >
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
      </footer>
    </div>

    <script src="tema.js"></script>
    <script src="player.js"></script>
    <script src="barra.js"></script>
  </body>
</html>
